name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generar wrapper de Gradle (si no existe)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Generar debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la debug.keystore

      - name: Escribir la API key de Blogger
        run: echo "BLOGGER_API_KEY=${{ secrets.BLOGGER_API_KEY }}" >> local.properties

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: datgarscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
