name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generar wrapper de Gradle (si no existe)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Restaurar la llave de firma de depuración (fija, desde Secrets)
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          ls -la debug.keystore

      - name: Escribir la API key de Blogger
        run: echo "BLOGGER_API_KEY=${{ secrets.BLOGGER_API_KEY }}" >> local.properties

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: datgarscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
