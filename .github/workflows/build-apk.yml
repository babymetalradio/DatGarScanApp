name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar el wrapper de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Escribir la API key de Blogger (desde Secrets, nunca se sube al repo)
        run: echo "BLOGGER_API_KEY=${{ secrets.BLOGGER_API_KEY }}" >> local.properties

      - name: Dar permisos de ejecución a gradlew
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug

      - name: Subir el APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: datgarscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
